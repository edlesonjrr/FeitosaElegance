            <img src="images/feitosaTeste1-removebg-preview.png" class="img-fluid2" alt="Logo">

            <!-- Botão Mobile -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>

            <!-- Links da navbar -->
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contato</a></li>
                    <li class="nav-item"><a href="loja.html" class="nav-link">Loja</a></li>

                    <!-- Link Admin (invisível por padrão, o JS mostrará quando for admin) -->

                        <a href="admin.html" id="admin-link" class="nav-link" style="display:none;">Admin Page</a>
                    </li>

                    <!-- Menu do Usuário (dropdown) -->
                    <li class="nav-item dropdown" id="user-menu" style="display:none;">
                        <a class="nav-link dropdown-toggle" href="#" id="navUserDropdown" role="button"
                            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">

                        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navUserDropdown">

                            <a class="dropdown-item" href="#" id="logout-btn">Sair</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- END NAV -->

    <!-- ÍCONE DO CARRINHO NO TOPO -->
    <div class="icon-cart top">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1" />
        </svg>
        <span>0</span>
    </div>

    <!-- CARRINHO LATERAL -->
    <div class="cartTab">
        <h1>Carrinho</h1>
        <div class="listCart"></div>
        <div class="btn">
            <button class="close">Fechar</button>
            <button class="checkOut">Finalizar</button>
        </div>
    </div>

    <!-- CONTEÚDO DO PRODUTO -->
    <div id="temporaryContent">

        <div class="title-details">DETALHES DO PRODUTO</div>

        <div class="detail">

            <div class="image">
                <img src="">
            </div>

            <div class="content">
                <h1 class="name"></h1>

                <div class="price"></div>

                <div class="buttons">
                    <button class="btn-buy">Comprar Agora</button>

                    <button class="btn-add addCart">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1" />
                        </svg>
                        Adicionar ao Carrinho
                    </button>
                </div>

                <div class="description"></div>
            </div>
        </div>

        <div class="title-details">Produtos Similares</div>
        <div class="listProduct"></div>
    </div>

    <!-- SCRIPTS (ordem correta e compatível com cartInit) -->
    <script type="module">
        import cartInit from "./js/cart.js";
        cartInit();

        import "./js/details.js";
    </script>

    <!-- 1) LIBS - DEVEM VIR PRIMEIRO -->

    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/aos.js"></script>
    <script src="js/jquery.animateNumber.min.js"></script>
    <script src="js/bootstrap-datepicker.js"></script>
    <script src="js/jquery.timepicker.min.js"></script>
    <script src="js/scrollax.min.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBVWaKrjvy3MaE7SQ74_uJiULgl1JY0H2s&sensor=false"></script>
    <script src="js/google-map.js"></script>
    <script src="js/main.js"></script>

    <!-- 2) AGORA SIM: SEUS SCRIPTS -->
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/cadastro.js"></script>
    <script type="module" src="js/userAuth.js"></script>
    <script type="module" src="js/navbar.js"></script>
