                </div>
            </div>

            <div class="row" id="product-list"></div>
        </div>

    <!-- ÍCONE FLUTUANTE DO CARRINHO -->
    <div id="cart-icon" class="cart-icon">
        <img src="images/carticon" alt="Carrinho">
    </div>

    <!-- POPUP DO CARRINHO -->
    <div id="cart-popup" class="cart-popup">
        <div class="popup-header">
            <h2>Carrinho</h2>
            <span id="close-popup" class="close-btn">&times;</span>
        </div>

        <ul id="cart-items" class="cart-items"></ul>
        <p id="total-price" class="total-price">Total: R$ 0,00</p>

        <button id="checkout-btn" class="checkout-btn">Finalizar via WhatsApp</button>
    </div>

    <!-- SCRIPT DE PRODUTOS AUTOMÁTICO -->
    <script>
        async function carregarProdutos() {
            const lista = document.getElementById("product-list");

            try {
                const url = "/.netlify/blobs/produtos/produtos.json";
                const res = await fetch(url);
                const produtos = await res.json();

                lista.innerHTML = "";

                produtos.forEach(p => {
                    const item = document.createElement("div");
                    item.className = "col-lg-3 d-flex mb-sm-4";

                    item.innerHTML = `
                <div class="product-card">
                    <div class="product-circle" style="background-image:url('${p.imagem}')"></div>
                    <div class="product-name">${p.nome}</div>
                    <div class="product-price">R$ ${Number(p.preco).toFixed(2)}</div>
                    <button class="add-to-cart-btn"
                        data-id="${p.id}"
                        data-name="${p.nome}"
                        data-price="${p.preco}">
                        Colocar no carrinho
                    </button>
                </div>
            `;

                    lista.appendChild(item);
                });

                document.querySelectorAll(".add-to-cart-btn").forEach(btn => {
                    btn.addEventListener("click", () => {
                        addToCart({
                            id: btn.dataset.id,
                            name: btn.dataset.name,
                            price: Number(btn.dataset.price)
                        });
                    });
                });

            } catch (err) {
                console.error("Erro ao carregar produtos:", err);
            }
        }

        carregarProdutos();
    </script>


    <script src="./js/cart.js"></script>

</body>
