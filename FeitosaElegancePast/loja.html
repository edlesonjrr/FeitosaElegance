<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loja | Feitosa Elegance</title>

    <!-- CSS PRINCIPAL DO SITE -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS DA LOJA -->
    <link rel="stylesheet" href="css/loja.css">
</head>

<body>

    <!-- NAVBAR ORIGINAL -->
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <img src="images/feitosaTeste1-removebg-preview.png" class="img-fluid2" alt="logo">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contato</a></li>
                    <li class="nav-item active"><a href="loja.html" class="nav-link">Loja</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ÍCONE DO CARRINHO NO TOPO -->
    <div class="icon-cart top">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1" />
        </svg>
        <span>0</span>
    </div>


    <!-- LISTA DE PRODUTOS -->
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center mb-5 pb-3">
                <div class="col-md-7 heading-section text-center">
                    <h2 class="mb-4">Nossa Loja</h2>
                    <p class="mt-3">Conheça um pouco dos nossos produtos</p>
                </div>
            </div>
            <!-- FILTRO DE CATEGORIA -->
            <div class="filter-box">
                <select id="categoryFilter">
                    <option value="all">Todos os Produtos</option>
                    <option value="Bolsas">Bolsas</option>
                    <option value="Relógios">Relógios</option>
                    <option value="Garrafas">Garrafas</option>
                    <option value="Carregadores">Carregadores</option>
                    <option value="Malas">Malas</option>
                    <option value="Fones">Fones de Ouvido</option>
                </select>
            </div>


            <div class="listProduct"></div>
        </div>
    </section>

    <!-- CARRINHO LATERAL -->
    <div class="cartTab">
        <h1>Carrinho</h1>
        <div class="listCart"></div>
        <div class="btn">
            <button class="close">Fechar</button>
            <button class="checkOut">Finalizar</button>
        </div>
    </div>

    <!-- SCRIPTS DA LOJA (ordem CORRETA) -->
    <script type="module">
        import cartInit from "./js/cart.js";
        import "./js/products.js";
        import "./js/index.js";

        cartInit(); // inicializa sistema de carrinho ANTES de tudo
    </script>



</body>

</html>
