    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
     <!-- START NAV -->
     <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <img src="images/feitosaTeste1-removebg-preview.png" class="img-fluid2" alt="">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item active"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contato</a></li>
                    <li class="nav-item"><a href="loja.html" class="nav-link">Loja</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- END NAV -->

    <!-- START CARROUSELL -->
    <section class="home-slider owl-carousel img" style="background-image: url(images/lojabolsa.jpg);">
        <div class="slider-item" style="background-image: url(images/lojabolsa.jpg);">
            <div class="overlay"></div>
            <div class="container">
                <div class="row slider-text justify-content-center align-items-center">
                    <div class="col-md-7 col-sm-12 text-center ftco-animate">
                        <h1 class="mb-3 mt-5 bread">LOJA</h1>
                        <p class="breadcrumbs"><span class="mr-2"><a href="index.html">Home</a></span>
                            <span>Sobre</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- END CARROUSELL -->

    <!-- Start Info-->
    <section class="ftco-intro">
        <div class="container-wrap">
            <div class="wrap d-md-flex">
                <div class="info">
                    <div class="row no-gutters">
                        <div class="col-md-4 d-flex ftco-animate">
                            <div class="icon"><span class="icon-phone"></span></div>
                            <div class="text">
                                <h3>(81) 98274-4190</h3>
                                <p>Número comercial</p>
                            </div>
                        </div>
                        <div class="col-md-4 d-flex ftco-animate">
                            <div class="icon"><span class="icon-my_location"></span></div>
                            <div class="text">
                                <h3>Jaboatão - Socorro</h3>
                                <p>Rua Senador Barros de C. 69E</p>
                            </div>
                        </div>
                        <div class="col-md-4 d-flex ftco-animate">
                            <div class="icon"><span class="icon-clock-o"></span></div>
                            <div class="text">
                                <h3>Aberto Segunda-Sexta</h3>
                                <p>8hrs - 17hrs</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="social d-md-flex pl-md-5 p-4 align-items-center">
                    <ul class="social-icon">
                        <li class="ftco-animate"><a href="#"><span class="icon-twitter"></span></a></li>
                        <li class="ftco-animate"><a href="https://www.facebook.com/profile.php?id=100091304688669"><span
                                    class="icon-facebook"></span></a></li>
                        <li class="ftco-animate"><a href="https://www.instagram.com/1up_agmkt/"><span
                                    class="icon-instagram"></span></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <!--End Info-->   

    <!-- START LOJA -->
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center mb-5 pb-3">
                <div class="col-md-7 heading-section text-center">
                    <h2 class="mb-4">Nossa Loja</h2>
                    <p class="mt-5">Conheça um pouco dos nossos produtos</p>
                </div>
            </div>

            <!-- Lista de produtos -->
            <div class="row" id="product-list">
                <!-- Produtos serão inseridos dinamicamente via JavaScript -->
            </div>
        </div>
    </section>
    <!-- END LOJA -->

    <!-- Pop-up do carrinho -->
    <div id="cart-popup">
        <span id="close-popup" class="close-popup">&times;</span>
        <h2>Carrinho</h2>
        <ul id="cart-items"></ul>
        <div id="total-container">
            <p id="total-price">Valor Total: R$ 0.00</p>
        </div>
        <button id="checkout-btn">Comprar via WhatsApp</button>
    </div>

    <script src="./js/cart.js"></script>
</body>

</html>
