<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loja | Feitosa Elegance</title>

    <!-- CSS PRINCIPAL DO SITE -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CSS DA LOJA -->
    <link rel="stylesheet" href="css/loja.css">
</head>

<body>

    <!-- NAVBAR ORIGINAL -->
    <nav class="navbar navbar-expand-lg navbar-dark ftco_navbar bg-dark ftco-navbar-light" id="ftco-navbar">
        <div class="container">
            <img src="images/feitosaTeste1-removebg-preview.png" class="img-fluid2" alt="logo">
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav"
                aria-controls="ftco-nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="oi oi-menu"></span> Menu
            </button>
            <div class="collapse navbar-collapse" id="ftco-nav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link">Sobre</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link">Contato</a></li>
                    <li class="nav-item active"><a href="loja.html" class="nav-link">Loja</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ÍCONE DO CARRINHO NO TOPO -->
    <div class="icon-cart top">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 18 20">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 15a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm0 0h8m-8 0-1-4m9 4a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-9-4h10l2-7H3m2 7L3 4m0 0-.792-3H1" />
        </svg>
        <span>0</span>
    </div>

    <!-- LISTA DE PRODUTOS -->
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center mb-5 pb-3">
                <div class="col-md-7 heading-section text-center">
                    <h2 class="mb-4">Nossa Loja</h2>
                    <p class="mt-3">Conheça um pouco dos nossos produtos</p>
                </div>
            </div>

            <!-- FILTRO DE CATEGORIA -->
            <div class="filter-box">
                <select id="categoryFilter">
                    <option value="all">Todos os Produtos</option>
                    <option value="Bolsas">Bolsas</option>
                    <option value="Relógios">Relógios</option>
                    <option value="Garrafas">Garrafas</option>
                    <option value="Carregadores">Carregadores</option>
                    <option value="Malas">Malas</option>
                    <option value="Fones">Fones de Ouvido</option>
                    <option value="Estojo">Estojo</option>
                </select>
            </div>

            <div class="listProduct"></div>
        </div>
    </section>

    <!-- CARRINHO LATERAL -->
    <div class="cartTab">
        <h1>Carrinho</h1>
        <div class="listCart"></div>
        <div class="btn">
            <button class="close">Fechar</button>
            <button class="checkOut">Finalizar</button>
        </div>
    </div>

    <!-- POP-UP DE FINALIZAÇÃO -->
    <div id="checkoutPopup" class="checkout-popup">
        <div class="popup-content">
            <span class="close-popup" id="closePopup">&times;</span>

            <h2>Finalizar Pedido</h2>

            <h3>Resumo do Pedido</h3>
            <div id="checkoutItems"></div>

            <h3>Total: <span id="checkoutTotal">R$ 0,00</span></h3>

            <h3>Método de Pagamento</h3>
            <select id="paymentMethod">
                <option value="Pix">Pix</option>
                <option value="Cartão de Crédito">Cartão de Crédito</option>
            </select>

            <h3>Retirada ou Entrega</h3>
            <select id="deliveryMethod">
                <option value="retirar">Retirar na loja</option>
                <option value="entregar">Entrega</option>
            </select>

            <div id="addressField" style="display:none; margin-top:10px;">
                <input type="text" id="deliveryAddress" placeholder="Digite o endereço completo">
            </div>

            <button id="sendWhatsApp" class="popup-button">Enviar Pedido pelo WhatsApp</button>
        </div>
    </div>

    <!-- SCRIPTS DA LOJA -->
    <script type="module">
        import cartInit from "./js/cart.js";
        import products from "./js/products.js";
        import "./js/index.js";

        /* ============================
           INICIALIZA CARRINHO
        ============================ */
        cartInit();

        /* ============================
           SELETORES
        ============================ */
        const cartTabBtn = document.querySelector(".checkOut");
        const checkoutPopup = document.getElementById("checkoutPopup");
        const closePopup = document.getElementById("closePopup");
        const checkoutItems = document.getElementById("checkoutItems");
        const checkoutTotal = document.getElementById("checkoutTotal");
        const paymentMethod = document.getElementById("paymentMethod");
        const deliveryMethod = document.getElementById("deliveryMethod");
        const addressField = document.getElementById("addressField");
        const sendWhatsApp = document.getElementById("sendWhatsApp");

        /* ============================
           GARANTE QUE O POP-UP NÃO ABRA SOZINHO
        ============================ */
        checkoutPopup.classList.remove("active");

        /* ============================
   CAMPOS DE ENDEREÇO
============================ */
        addressField.innerHTML = `
    <input id="addressStreet" type="text" placeholder="Rua / Avenida">
    <input id="addressNumber" type="text" placeholder="Número">
    <input id="addressDistrict" type="text" placeholder="Bairro">
    <input id="addressComplement" type="text" placeholder="Complemento (Opcional)">
    <input id="addressRef" type="text" placeholder="Referência (Opcional)">

    <div class="frete-box">
        <p><strong>Frete:</strong> O valor será informado pelo atendente no WhatsApp.</p>
    </div>
`;

        /* ============================
           ABRIR POP-UP
        ============================ */
        cartTabBtn.addEventListener("click", () => {
            loadCheckoutData();
            checkoutPopup.classList.add("active");
        });

        /* ============================
           FECHAR POP-UP (X)
        ============================ */
        closePopup.addEventListener("click", () => {
            checkoutPopup.classList.remove("active");
        });

        /* ============================
           MOSTRAR/OCULTAR CAMPOS DE ENDEREÇO
        ============================ */
        deliveryMethod.addEventListener("change", () => {
            addressField.style.display =
                deliveryMethod.value === "entregar" ? "block" : "none";
        });

        /* ============================
           CARREGAR RESUMO DO PEDIDO
        ============================ */
        function loadCheckoutData() {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            checkoutItems.innerHTML = "";

            let total = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.product_id);
                if (!product) return;

                const subtotal = product.price * item.quantity;
                total += subtotal;

                checkoutItems.innerHTML += `
                <p><strong>${product.name}</strong> x${item.quantity} — R$ ${subtotal.toFixed(2)}</p>
            `;
            });

            checkoutTotal.innerText = "R$ " + total.toFixed(2);
        }

        /* ============================
           ENVIAR PEDIDO PARA O WHATSAPP
        ============================ */
        sendWhatsApp.addEventListener("click", () => {
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            let message = "*NOVO PEDIDO — FEITOSA ELEGANCE*\n\n";

            let total = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.product_id);
                if (!product) return;

                const subtotal = product.price * item.quantity;
                total += subtotal;

                message += `• ${product.name} x${item.quantity} — R$ ${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total:* R$ ${total.toFixed(2)}`;
            message += `\n*Pagamento:* ${paymentMethod.value}`;
            message += `\n*Entrega:* ${deliveryMethod.value === "entregar" ? "Entrega" : "Retirada na loja"}`;

            if (deliveryMethod.value === "entregar") {
                const v = id => document.getElementById(id).value;

                message += `\n\n*Endereço:* ${v("addressStreet")}, ${v("addressNumber")} - ${v("addressDistrict")}`;
                if (v("addressComplement")) message += `\n*Complemento:* ${v("addressComplement")}`;
                if (v("addressRef")) message += `\n*Referência:* ${v("addressRef")}`;
            }

            const url = `https://wa.me/5581987225748?text=${encodeURIComponent(message)}`;
            window.open(url, "_blank");
        });
    </script>







</body>

</html>
