	<!DOCTYPE html>
	<html lang="pt-BR">

	<head>
		<title>Cadastro / Login - Feitosa Elegance</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- FONTES / ICONS -->
		<link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet">
		<link rel="stylesheet" href="css/open-iconic-bootstrap.min.css">

		<!-- CSS -->
		<link rel="stylesheet" href="css/animate.css">
		<link rel="stylesheet" href="css/cadastro.css">

		<link rel="shortcut icon" href="./images/carroseuimage.webp" type="image/x-icon">
	</head>

	<body>

		<input type="checkbox" id="click">

		<div class="main-container">

			<!-- =====================================================================
									FORMULÁRIOS
			====================================================================== -->
			<div class="form-container">

				<!-- ========================= LOGIN =============================== -->
				<div class="sign-in">
					<form id="loginForm">
						<h1>Login</h1>

						<span>Entre com sua conta</span>

						<input id="loginEmail" type="email" placeholder="Email" required />
						<input id="loginPassword" type="password" placeholder="Senha" required />

						<!-- Mensagem -->
						<div class="feedback-msg"></div>

						<a href="./remember.html" class="fogot-pass">Esqueceu sua senha?</a>

						<button type="submit">Entrar</button>
					</form>
				</div>

				<!-- ========================= CADASTRO ============================ -->
				<div class="sign-up">
					<form id="signupForm">
						<h1>Cadastro</h1>

						<span>Crie sua conta rapidamente</span>

						<input id="signupName" type="text" placeholder="Nome completo" required />
						<input id="signupEmail" type="email" placeholder="Email" required />
						<input id="signupPassword" type="password" placeholder="Senha (mínimo 6 caracteres)" required />

						<!-- Mensagem -->
						<div class="feedback-msg"></div>

						<button type="submit">Cadastrar</button>
					</form>
				</div>

			</div>

			<!-- =====================================================================
									SLIDE
			====================================================================== -->
			<div class="slide-container">
				<div class="slide-panel">

					<div class="slide-left">
						<h1>Bem-vindo!</h1>
						<p>Crie sua conta e aproveite nossos produtos exclusivos.</p>

						<label for="click" class="slide">Criar conta</label>

						<a href="./index.html" class="botaocad">Página inicial</a>
					</div>

					<div class="slide-right">
						<h1>Faça Login!</h1>
						<p>Acesse sua conta e continue sua experiência.</p>

						<label for="click" class="slide">Entrar</label>

						<a href="./index.html" class="botaocad">Página inicial</a>
					</div>

				</div>
			</div>

		</div>

		<!-- FIREBASE -->
		<script type="module" src="js/firebase.js"></script>

		<!-- AUTENTICAÇÃO / VALIDAÇÃO -->
		<script type="module" src="js/cadastro.js"></script>

	</body>

	</html>
