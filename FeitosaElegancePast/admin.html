<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel Admin - Produtos</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial;
            padding: 30px;
        }

        .card {
            background: #1b1b1b;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #000;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #c99b2a;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #preview img {
            max-width: 150px;
            margin-top: 10px;
            border-radius: 6px;
        }

        pre {
            white-space: pre-wrap;
            background: #000;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        a.download-link {
            color: #c99b2a;
            display: block;
            margin-top: 10px;
        }

        .btn-voltar {
            display: inline-block;
            background: #c99b2a;
            color: #000;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .btn-voltar:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Painel Admin — Criar Produto</h2>

        <label>Nome do Produto</label>
        <input id="nome">

        <label>Preço (número)</label>
        <input id="preco">

        <label>Imagem (PNG/JPG)</label>
        <input id="imagem" type="file" accept="image/*">

        <div id="preview"></div>

        <button id="criar">Adicionar Produto</button>

        <h3 style="margin-top:25px">Produtos Criados (local)</h3>
        <pre id="lista"></pre>

        <a href="loja.html" target="_blank" class="btn-voltar">⬅ Voltar para a Loja</a>
    </div>

    <script>
        const nome = document.getElementById("nome");
        const preco = document.getElementById("preco");
        const imagem = document.getElementById("imagem");
        const preview = document.getElementById("preview");
        const lista = document.getElementById("lista");
        const criar = document.getElementById("criar");

        let produtos = [];

        function atualizarLista() {
            lista.textContent = JSON.stringify(produtos, null, 2);
        }

        imagem.addEventListener("change", () => {
            const file = imagem.files[0];
            if (!file) return preview.innerHTML = "";
            const url = URL.createObjectURL(file);
            preview.innerHTML = `<img src="${url}">`;
        });

        criar.addEventListener("click", () => {
            const nomeVal = nome.value.trim();
            const precoVal = Number(preco.value);
            const file = imagem.files[0];

            if (!nomeVal || !precoVal || !file) {
                alert("Preencha nome, preço e imagem.");
                return;
            }

            const id = "prod_" + Math.random().toString(36).substr(2, 9);
            const imgNome = `${id}.png`;

            // Adiciona ao array local
            const produto = {
                id,
                nome: nomeVal,
                preco: precoVal,
                imagem: `images/produtos/${imgNome}`
            };

            produtos.push(produto);
            atualizarLista();

            // Baixar produtos.json atualizado
            const blobJSON = new Blob([JSON.stringify(produtos, null, 2)], { type: "application/json" });
            const aJSON = document.createElement("a");
            aJSON.href = URL.createObjectURL(blobJSON);
            aJSON.download = "produtos.json";
            aJSON.className = "download-link";
            aJSON.textContent = "📄 Baixar produtos.json atualizado";
            preview.appendChild(aJSON);

            // Baixar a imagem renomeada
            const reader = new FileReader();
            reader.onload = e => {
                const imgBlob = new Blob([e.target.result]);
                const aIMG = document.createElement("a");
                aIMG.href = URL.createObjectURL(imgBlob);
                aIMG.download = imgNome;
                aIMG.className = "download-link";
                aIMG.textContent = "🖼️ Baixar imagem renomeada";
                preview.appendChild(aIMG);
            };
            reader.readAsArrayBuffer(file);

            // Limpar formulário
            nome.value = "";
            preco.value = "";
            imagem.value = "";
            preview.innerHTML = "";
        });
    </script>


</body>

</html>
