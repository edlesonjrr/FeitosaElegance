<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel Admin - Produtos</title>

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial;
            padding: 30px;
        }

        .card {
            background: #1b1b1b;
            padding: 25px;
            border-radius: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            background: #000;
            border: 1px solid #333;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #c99b2a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            color: black;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .msg {
            margin-top: 20px;
            padding: 10px;
            background: #222;
            border-left: 4px solid #c99b2a;
        }

        .btn-voltar {
            display: inline-block;
            background: #c99b2a;
            color: #000;
            padding: 10px 18px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            margin-top: 50px;
        }

        .btn-voltar:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="card">

        <h2>Painel Admin — Criar Produto</h2>

        <label>Nome do Produto</label>
        <input id="nome">

        <label>Preço</label>
        <input id="preco" type="number">

        <label>Imagem</label>
        <input id="imagem" type="file" accept="image/*">

        <button id="criar">Criar Produto</button>

        <div id="msg" class="msg" style="display:none;"></div>
        <br>
        <a href="loja.html" target="_blank" class="btn-voltar">⬅ Voltar para a Loja</a>

    </div>

    <script>
        const nome = document.getElementById("nome");
        const preco = document.getElementById("preco");
        const imagem = document.getElementById("imagem");
        const criar = document.getElementById("criar");
        const msg = document.getElementById("msg");

        async function uploadImg(file) {
            const form = new FormData();
            form.append("file", file);

            const res = await fetch("/.netlify/functions/uploadImagem", {
                method: "POST",
                body: form
            });

            return res.json();
        }

        async function addProdutoAPI(dados) {
            const res = await fetch("/.netlify/functions/addProduto", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dados)
            });

            return res.json();
        }

        criar.addEventListener("click", async () => {
            if (!nome.value || !preco.value || !imagem.files[0]) {
                alert("Preencha tudo!");
                return;
            }

            msg.style.display = "block";
            msg.innerHTML = "Enviando imagem...";

            // 1) Enviar imagem
            const imgUpload = await uploadImg(imagem.files[0]);

            if (!imgUpload.url) {
                msg.innerHTML = "Erro ao enviar imagem!";
                return;
            }

            msg.innerHTML = "Salvando produto...";

            // 2) Criar produto
            const novo = await addProdutoAPI({
                nome: nome.value,
                preco: Number(preco.value),
                imagem: imgUpload.url
            });

            msg.innerHTML = "Produto criado com sucesso!";

            nome.value = "";
            preco.value = "";
            imagem.value = "";
        });
    </script>

</body>

</html>
